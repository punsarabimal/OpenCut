name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Web Asset Wrapper
      run: |
        mkdir android-wrapper
        cd android-wrapper
        npm init -y
        npm install @capacitor/cli@5.7.0 @capacitor/core@5.7.0 @capacitor/android@5.7.0
        npx cap init OpenCut app.opencut.app --web-dir dist
        mkdir dist
        cat << 'EOF' > dist/index.html
        <!DOCTYPE html>
        <html>
        <head>
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>OpenCut</title>
          <style>
            body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #000; }
            iframe { border: none; width: 100vw; height: 100vh; }
          </style>
        </head>
        <body>
          <iframe src="https://opencut.app"></iframe>
        </body>
        </html>
        EOF
        npx cap add android
        npx cap copy

    - name: Build APK via Gradle
      run: |
        cd android-wrapper/android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenCut-Android-APK
        path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
